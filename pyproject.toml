[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "software-update-verification-poc"
version = "0.1.0"
description = "Proof of concept for AI-assisted software update verification."
requires-python = ">=3.13"
dependencies = [
    "openai==3.6.0",
    "pydantic>=2,<3",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "httpx2==2.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
